<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    nucleo/static/nucleo/img/iconos.svg
    ===================================
    Todos los íconos del sistema en un solo archivo. Cada <symbol> es un
    ícono; se dibuja en las plantillas con {% icono "nombre" %}
    (nucleo/templatetags/iconos.py), que usa el id "i-nombre".
    Todos son de 24x24, solo con trazo (sin relleno), y toman el color del
    texto que los rodea (currentColor).
  -->

  <!-- ===== Marca provisional (mientras llega el logo nuevo) ===== -->
  <!-- Tres capas apiladas -->
  <symbol id="i-marca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 3 7.5l9 4.5 9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/>
  </symbol>

  <!-- ===== Módulos ===== -->
  <!-- Inicio: una casa -->
  <symbol id="i-inicio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/>
  </symbol>
  <!-- Inventario: una caja -->
  <symbol id="i-inventario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9M7.5 5.2l9 4.6"/>
  </symbol>
  <!-- Cuentas por cobrar: dinero que entra (flecha hacia la bandeja) -->
  <symbol id="i-cxc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v11M7.5 9.5 12 14l4.5-4.5"/><path d="M3 14v5a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-5"/>
  </symbol>
  <!-- Cuentas por pagar: dinero que sale (flecha saliendo de la bandeja) -->
  <symbol id="i-cxp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 14V3M7.5 7.5 12 3l4.5 4.5"/><path d="M3 14v5a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-5"/>
  </symbol>
  <!-- Cajas y bancos: un banco con columnas -->
  <symbol id="i-cajas_bancos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9 12 4l9 5H3z"/><path d="M6 12v5M10 12v5M14 12v5M18 12v5M3 20h18"/>
  </symbol>
  <!-- Mantenimiento: controles deslizantes (ajustes) -->
  <symbol id="i-mantenimiento" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
  </symbol>

  <!-- ===== Secciones ===== -->
  <!-- Tablas: una cuadrícula -->
  <symbol id="i-tablas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M3 15h18M9 9.5V20"/>
  </symbol>
  <!-- Procesos: flechas en ciclo -->
  <symbol id="i-procesos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18.5 3v4.2h-4.2M5.5 21v-4.2h4.2"/>
  </symbol>
  <!-- Reportes: documento con barras -->
  <symbol id="i-reportes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9.5 17v-3M12 17v-6M14.5 17v-2"/>
  </symbol>
  <!-- Consultas: lupa -->
  <symbol id="i-consultas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
  </symbol>

  <!-- ===== Generales ===== -->
  <symbol id="i-buscar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
  </symbol>
  <!-- Salir: puerta con flecha hacia afuera -->
  <symbol id="i-salir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="m15 16 4-4-4-4M19 12H9"/>
  </symbol>
  <!-- Empresa: edificio -->
  <symbol id="i-empresa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h3a1 1 0 0 1 1 1v11M2 21h20"/><path d="M8 7h4M8 11h4M8 15h4"/>
  </symbol>
  <!-- Menú (hamburguesa) -->
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6h16M4 12h16M4 18h16"/>
  </symbol>
  <!-- Cerrar: una X -->
  <symbol id="i-cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6l12 12M18 6 6 18"/>
  </symbol>
  <!-- Flechas pequeñas -->
  <symbol id="i-derecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m9 6 6 6-6 6"/>
  </symbol>
  <symbol id="i-abajo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 9 6 6 6-6"/>
  </symbol>
  <symbol id="i-atras" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5M11 6l-6 6 6 6"/>
  </symbol>
  <!-- Usuario -->
  <symbol id="i-usuario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
  </symbol>
  <!-- Candado (inicio de sesión) -->
  <symbol id="i-candado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
  </symbol>
  <!-- En construcción: un cono -->
  <symbol id="i-obra" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 4h5l5 16h-15z"/><path d="M7.6 14h8.8M8.8 9.5h6.4M3 20h18"/>
  </symbol>
  <!-- Cambiar (dos flechas opuestas) -->
  <symbol id="i-cambiar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>
  </symbol>
  <!-- Base de datos -->
  <symbol id="i-base" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/>
  </symbol>
  <!-- Calendario -->
  <symbol id="i-calendario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
  </symbol>
  <!-- Panel de administración: escudo -->
  <symbol id="i-admin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2 2 4-4"/>
  </symbol>
</svg>
